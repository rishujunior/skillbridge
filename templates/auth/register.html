{% extends "auth/base.html" %}
{% block title %}Create your account — SkillBridge{% endblock %}
{% block content %}
<section class="auth-card" aria-labelledby="register-title">
    <p class="eyebrow"><span></span>Start your path</p>
    <h1 id="register-title">Create your account.</h1>
    <p class="auth-card__intro">Save your progress and return to your direction whenever you need to.</p>
    <form method="post" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-field">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" autocomplete="name" required minlength="2" maxlength="100" value="{{ request.form.get('name', '') }}">
        </div>
        <div class="form-field">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" required value="{{ request.form.get('email', '') }}">
        </div>
        <div class="form-field">
            <label for="password">Password <span>8 characters minimum</span></label>
            <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8">
        </div>
        <div class="form-field">
            <label for="password_confirmation">Confirm password</label>
            <input id="password_confirmation" name="password_confirmation" type="password" autocomplete="new-password" required minlength="8">
        </div>
        <button class="button auth-submit" type="submit">Create account <span aria-hidden="true">→</span></button>
    </form>
    <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</section>
{% endblock %}

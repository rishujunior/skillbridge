{% extends "auth/base.html" %}
{% block title %}Log in — SkillBridge{% endblock %}
{% block content %}
<section class="auth-card" aria-labelledby="login-title">
    <p class="eyebrow"><span></span>Welcome back</p>
    <h1 id="login-title">Pick up where you left off.</h1>
    <p class="auth-card__intro">Log in to continue building your direction.</p>
    <form method="post" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-field">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" required value="{{ request.form.get('email', '') }}">
        </div>
        <div class="form-field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="button auth-submit" type="submit">Log in <span aria-hidden="true">→</span></button>
    </form>
    <p class="auth-switch">New to SkillBridge? <a href="{{ url_for('register') }}">Create an account</a></p>
</section>
{% endblock %}
